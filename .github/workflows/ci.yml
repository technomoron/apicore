name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    env:
      TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306/apicore_test
      TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/apicore_test
      # This job provisions both services below, so it promises both dialects.
      # A promised dialect that cannot be reached fails the run instead of
      # silently skipping its suite. Environments that only have SQLite leave
      # this unset and run the SQLite suites alone.
      TEST_REQUIRED_DIALECTS: mysql,postgres

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: apicore_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: apicore_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d apicore_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pnpm
        run: npm install -g pnpm@11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r lint

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test
